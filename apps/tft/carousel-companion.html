    const slot=activeSlot;query='';input.value='';searchIndex=0;
    mutate(()=>{offers().ids[slot]=id;},'Offer '+(slot+1)+' entered.');
    const next=offers().ids.findIndex((id,n)=>n>slot&&!id);activeSlot=next>=0?next:Math.max(0,offers().ids.findIndex(id=>!id));draw();input.focus();
  }
  button.addEventListener('click',()=>open());
  input.addEventListener('input',e=>{query=e.target.value;searchIndex=0;search();});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&searchRows[searchIndex]){e.preventDefault();add(searchRows[searchIndex].apiName);}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();searchIndex+=e.key==='ArrowDown'?1:-1;search();}else if(e.key==='Escape'&&query){e.preventDefault();e.stopPropagation();query='';input.value='';search();}});
  document.addEventListener('click',e=>{
    let b=e.target.closest('[data-offer-add]');if(b)add(b.dataset.offerAdd);
    b=e.target.closest('[data-edit-augment]');if(b)open(Number(b.dataset.editAugment));
    b=e.target.closest('[data-augment-round]');if(b){const round=Number(b.dataset.augmentRound);if(round===offers().round)return;query='';input.value='';activeSlot=0;mutate(()=>state.augmentOffers={round,ids:['','',''],seen:[]},'Augment round changed.');input.focus();}
    b=e.target.closest('[data-offer-edit]');if(b){activeSlot=Number(b.dataset.offerEdit);query='';input.value='';draw();input.focus();}
    b=e.target.closest('[data-offer-replace]');if(b){activeSlot=Number(b.dataset.offerReplace);query='';input.value='';mutate(()=>{const o=offers(),id=o.ids[activeSlot];if(id&&!o.seen.includes(id))o.seen.push(id);o.ids[activeSlot]='';},'Enter the new offer after rerolling in game.');input.focus();}
    b=e.target.closest('[data-augment-take]');if(b){let recorded=false;mutate(()=>{recorded=AugmentAdvisor.record(state,Number(b.dataset.augmentTake));},'Augment recorded. Enter any item rewards when received.');if(recorded)modal.close();}
  });
  const previous=render;render=function(){previous();contextKey='';draw();};
  document.addEventListener('carousel-new-game',()=>{modal.close();query='';input.value='';contextKey='';drawSelected();});
  document.addEventListener('carousel-meta-updated',()=>{contextKey='';draw();});
  document.querySelector('#help ol').insertAdjacentHTML('beforeend','<li><b>Augment choices:</b> type a few letters and Enter for each of the three offers. Entry advances automatically. The round defaults to your next unrecorded augment; change it if needed. Took this records the selected augment, keeps your inventory untouched and updates comp fit. Enter reroll replaces only that offer after you reroll in game. Reroll guidance is conditional; the app does not know the replacement pool or rerolls left.</li>');
  drawSelected();return {open,refresh:draw};
})();

/* Anvil entry is offer selection only. Inventory changes only on Took this.
   Numeric shortcuts are scoped to the topmost component-anvil dialog. */
const AnvilUI=(()=>{
  const types=[['components','Components'],['ornns','Artifacts'],['craftables','Completed'],['radiants','Radiant'],['emblems','Emblems']];
  let type='ornns',mode='browse',query='',rows=[],matches=[],searchIndex=0,offers={};
  const modal=document.createElement('dialog');modal.id='anvil-dialog';modal.setAttribute('aria-labelledby','anvil-dialog-title');
  modal.innerHTML='<div class="modal-heading"><h2 id="anvil-dialog-title">Anvil choices</h2><button data-close="anvil-dialog" aria-label="Close anvil choices">×</button></div><div id="anvil-tabs" class="decision-tabs" role="group" aria-label="Anvil item category"></div><div class="anvil-mode" role="group" aria-label="Browse or compare anvil offers"><button data-anvil-mode="browse">Full priority list</button><button data-anvil-mode="compare">My offers</button></div><p id="anvil-instructions" class="decision-note"></p><div id="anvil-component-keys" class="anvil-component-keys" hidden></div><div class="anvil-search-wrap"><label for="anvil-search" class="visuallyhidden">Find an offered item</label><input id="anvil-search" class="search" type="search" autocomplete="off" placeholder="Find an offered item…"><div id="anvil-search-matches" hidden></div></div><div id="anvil-offer-chips" class="anvil-offer-chips"></div><div id="anvil-verdict" role="status" aria-live="polite"></div><div id="anvil-results" class="decision-list"></div>';
  document.body.append(modal);
  const input=document.getElementById('anvil-search'),searchList=document.getElementById('anvil-search-matches');
  const picked=()=>offers[type]||[];
  function setQuery(q=''){query=q;input.value=q;searchIndex=0;}
  function matchesQuery(r,q){return Academy.normalizeName(r.item.name).includes(q)||Academy.normalizeName(shortNames[r.item.id]||'').includes(q);}
  function addOffer(id){
    if(!rows.some(r=>r.item.id===id)||picked().includes(id))return;
    offers[type]=[...picked(),id];mode='compare';setQuery();draw();input.focus();
  }
  function removeOffer(id){offers[type]=picked().filter(x=>x!==id);draw();}
  function drawSearch(){
    const q=Academy.normalizeName(query),available=rows.filter(r=>!picked().includes(r.item.id)&&matchesQuery(r,q));
    matches=q?available.sort((a,b)=>Number(!Academy.normalizeName(a.item.name).startsWith(q))-Number(!Academy.normalizeName(b.item.name).startsWith(q))).slice(0,7):[];
    searchIndex=Math.max(0,Math.min(searchIndex,matches.length-1));
    searchList.hidden=mode!=='compare'||!q;
    searchList.innerHTML=matches.map((r,n)=>`<button class="${n===searchIndex?'search-active':''}" data-anvil-offer-add="${esc(r.item.id)}">${icon(r.item.id)}<span>${esc(r.item.name)}</span><small>Add offer ↵</small></button>`).join('')||'<p>No new match in this category.</p>';
  }
  function draw(recalculate=false){
    if(recalculate)rows=DecisionPlanner.anvil(state,type);
    // A refresh can remove items from a set; never record a stale offer.
    offers[type]=picked().filter(id=>rows.some(r=>r.item.id===id));
    document.getElementById('anvil-tabs').innerHTML=types.map(([id,name])=>`<button data-anvil-type="${id}" aria-pressed="${type===id}">${name}</button>`).join('');
    for(const b of modal.querySelectorAll('[data-anvil-mode]'))b.setAttribute('aria-pressed',String(mode===b.dataset.anvilMode));
    input.placeholder=mode==='compare'?'Type an offer, Enter → add the next…':'Find an offered item… Enter adds to My offers';
    document.getElementById('anvil-instructions').textContent=mode==='compare'?'Enter the options shown in game. Use a take button to add it to inventory.':'Pick the highest-ranked item you see in game, or enter offers to compare.';
    const keys=document.getElementById('anvil-component-keys');keys.hidden=type!=='components';
    keys.innerHTML=type==='components'?'<small>1–8 add offers · Shift + number removes · no inventory changes</small><div>'+componentOrder.slice(0,8).map((id,n)=>`<button data-component-offer="${id}" aria-pressed="${picked().includes(id)}" aria-label="${n+1}: ${esc(byId[id].name)} ${picked().includes(id)?'offered, click to remove':'add offer'}"><kbd>${n+1}</kbd>${icon(id)}<span>${esc(shortNames[id])}</span></button>`).join('')+'</div>':'';
    document.getElementById('anvil-offer-chips').innerHTML=mode==='compare'?picked().map(id=>`<button data-anvil-offer-remove="${esc(id)}" title="Remove ${esc(byId[id].name)} from offers" aria-label="Remove offered ${esc(byId[id].name)}">${icon(id)}<span>${esc(byId[id].name)}</span><b>×</b></button>`).join('')+(picked().length?'<button id="anvil-clear-offers" class="quiet">Clear offers</button>':''):'';
    const q=Academy.normalizeName(query),visible=mode==='compare'?rows.filter(r=>picked().includes(r.item.id)):rows.filter(r=>matchesQuery(r,q));
    const ranked=[...visible]; // model order (including pins) is authoritative
    const best=ranked[0],second=ranked[1];
    const supported=best&&(best.component?best.score>0||state.pins.includes(best.item.id):best.score>0);
    const tied=second&&best.score===second.score&&(!best.component||(!!best.count===!!second.count&&(!best.count||best.carrierRank===second.carrierRank)&&state.pins.includes(best.item.id)===state.pins.includes(second.item.id)));
    let verdict='';
    if(mode==='compare')verdict=!ranked.length?'Add your offers to compare.':ranked.length===1?'1 offer entered — add the others to compare.':!supported?'No supported preference among these offers.':tied?'Top options are similarly supported.':'';
    document.getElementById('anvil-verdict').textContent=verdict;
    document.getElementById('anvil-verdict').hidden=!verdict;
    document.getElementById('anvil-results').innerHTML=ranked.map((r,n)=>{
      const recommended=mode==='compare'&&ranked.length>1&&n===0&&supported&&!tied;
      const count=r.component?(r.count?`<b class="component-shortage">×${r.count} needed</b>`:'<small>No queued need</small>'):'';
      const tag=r.component&&state.pins.includes(r.item.id)?'<span class="anvil-recommended">Pinned priority</span>':'';
      return `<article class="decision-row anvil-row ${r.score>0?'supported':''} ${recommended?'recommended-offer':''}">${recommended?'<span class="anvil-pick-check" role="img" aria-label="Recommended choice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span>':`<span class="anvil-rank">${n+1}</span>`}<div class="decision-primary">${icon(r.item.id)}<div><strong>${esc(r.item.name)}</strong>${count}<small>${esc(r.reason)}</small>${tag}</div></div><div class="anvil-fit">${r.champion?IconUI.championLabel(r.champion):''}${!state.activeComp&&r.guide?'<small>'+esc(r.guide.title)+'</small>':''}</div>${mode==='browse'?`<button class="anvil-compare-add" data-anvil-offer-add="${esc(r.item.id)}" aria-label="Add ${esc(r.item.name)} to offers">+ Offer</button>`:''}<button data-take-anvil="${esc(r.item.id)}" ${r.component&&(state.owned[r.item.id]||0)>=99?'disabled':''} aria-label="${recommended?'Recommended: take':'Record'} ${esc(r.item.name)} from anvil">${recommended?'Take this':'Took this'}</button></article>`;
    }).join('')||(mode==='compare'?'':'<p class="decision-note">No matching items.</p>');
    drawSearch();
  }
  function open(){setQuery();draw(true);modal.showModal();if(type!=='components')input.focus();}
  document.getElementById('anvil-open').addEventListener('click',open);
  input.addEventListener('input',e=>{query=e.target.value;searchIndex=0;draw();});
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&matches[searchIndex]){e.preventDefault();addOffer(matches[searchIndex].item.id);}
    else if(mode==='compare'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();searchIndex+=e.key==='ArrowDown'?1:-1;drawSearch();}
    else if(e.key==='Escape'&&query){e.preventDefault();e.stopPropagation();setQuery();draw();}
  });
  modal.addEventListener('click',e=>{
    let b=e.target.closest('[data-anvil-type]');if(b){type=b.dataset.anvilType;setQuery();draw(true);}
    b=e.target.closest('[data-anvil-mode]');if(b){mode=b.dataset.anvilMode;setQuery();draw();if(type!=='components')input.focus();}
    b=e.target.closest('[data-anvil-offer-add]');if(b)addOffer(b.dataset.anvilOfferAdd);
    b=e.target.closest('[data-anvil-offer-remove]');if(b)removeOffer(b.dataset.anvilOfferRemove);
    b=e.target.closest('#anvil-clear-offers');if(b){offers[type]=[];draw();}
    b=e.target.closest('[data-component-offer]');if(b){const id=b.dataset.componentOffer;if(picked().includes(id))removeOffer(id);else addOffer(id);}
    b=e.target.closest('[data-take-anvil]');if(b&&!b.disabled){const row=rows.find(r=>r.item.id===b.dataset.takeAnvil);if(!row)return;
      const component=!!row.component;mutate(()=>DecisionPlanner.receiveAnvil(state,row),component?row.item.name+' received from anvil.':row.item.name+' received; loose components kept.');
      offers={};mode='browse';setQuery();modal.close();
    }
  });
  document.addEventListener('keydown',e=>{
    if(!modal.open||type!=='components'||e.defaultPrevented||e.repeat||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
    const dialogs=[...document.querySelectorAll('dialog[open]')];if(dialogs[dialogs.length-1]!==modal)return;
    const match=/^(?:Digit|Numpad)([1-8])$/.exec(e.code||'');if(!match)return;
    if(document.activeElement===input&&query.trim())return;
    e.preventDefault();const id=componentOrder[Number(match[1])-1];if(e.shiftKey)removeOffer(id);else addOffer(id);
  });
  const previous=render;render=function(){previous();if(modal.open)draw(true);};
  document.addEventListener('carousel-meta-updated',()=>{if(modal.open)draw(true);});
  document.addEventListener('carousel-new-game',()=>{modal.close();offers={};mode='browse';setQuery();});
  document.querySelector('#help ol').insertAdjacentHTML('beforeend','<li><b>Anvil offers:</b> keep the full priority list, or switch to My offers. Type a few letters and Enter for each option; the chosen offers are ranked automatically. Component anvils also use the displayed 1–8 keys (Shift removes an offer). These keys only enter offers inside that dialog. Took this adds exactly one selected item; component anvils are recorded as Other, not PvE. Closing and reopening keeps unfinished offers; taking an item clears them.</li><li><b>Carousel counts:</b> ×N is the number still missing from your current queue after using your loose bench components. Planned needs rank before alternatives. Pivot item means a component supports a suggested alternative build; Not needed means no current queue shortage or supported pivot. Pins move components within these priority groups. The single item icon shows the highest-priority planned target, or the top compatible pivot when there is no planned need. Completed copies and loose components are already accounted for.</li>');
  return {open,refresh:()=>draw(true)};
})();

/* Curated from BunnyMuffins' Patch 18.3b opener guidance and the archetypes'
   needs. The groupings apply to augment types, independent of live rankings. */
(() => {
  const priorities = {
    fast9: ['Econ › Item › Combat', 'Item › Combat › Econ', 'Combat › Item › Econ'],
    reroll: ['Item › Combat › Econ', 'Combat › Item › Econ', 'Combat › Item › Econ'],
    flex: ['Item › Combat › Econ', 'Item › Combat › Econ', 'Item › Combat › Econ']
  };
  const banner = document.createElement('div');
  banner.className = 'opener-banner';
  banner.innerHTML = '<small>Opener guidance · Patch 18.3b</small><p id="opener-guidance"></p>';
  const guidance = banner.querySelector('p');
  const workspace = document.querySelector('.workspace');
  const shopping = document.querySelector('.shopping');
  const nextBuild = document.getElementById('next-build');
  nextBuild.after(banner);

  function openers() {
    const units = CompFinder.units(state);
    const completed = state.queue.filter(q => q.done);
    const owns = apiName => {
      const id = Academy.itemMap.get(apiName);
      return id && completed.some(q => Academy.itemMatches(id, q.item));
    };
    const rules = [];
    if (Academy.live) {
      const guide = slug => Academy.snapshot.guides.find(g => g.compSlug === slug);
      const invoker = guide('set-18-ahri-morgana');
      if (invoker && owns('DA_18_EmblemInvoker')) rules.push('Invoker Emblem → ' + invoker.title);
      const veigar = guide('set-18-dark-mages');
      if (veigar && units.some(u => u.apiName === 'DA_18_Veigar' && u.stars >= 2) &&
          veigar.finalComp.find(u => u.apiName === 'DA_18_Veigar')?.items.some(owns)) {
        rules.push('Veigar 2 + slam → ' + veigar.title);
      }
      const ticket = CompFinder.augment('DA_PrismaticTicket');
      const kayle = guide('set-18-solar-kayle');
      if (kayle && ticket && CompFinder.heldAugments(state).includes(ticket.apiName)) {
        rules.push(ticket.name + ' → ' + kayle.title);
      }
    }
    rules.push(completed.length ? 'Build around your slam' : 'Slam for tempo');
    rules.push(units.some(u => u.stars >= 2) ? 'Play your upgrades' : 'Look for early upgrades');
    return rules.slice(0, 2).join(' · ');
  }

  function draw() {
    const guide = Academy.currentGuide(state) || Academy.guide(state);
    if (state.activeComp) {
      // Use the next unrecorded round so opening or reviewing the chooser cannot
      // change the banner. After the third pick, retain the final round.
      const next = AugmentAdvisor.slots(state).findIndex(id => !id);
      const round = next === -1 ? AugmentAdvisor.stages.length - 1 : next;
      const style = guide?.style || guide?.title || '';
      const archetype = /reroll/i.test(style) ? 'reroll' : /fast\s*9\b/i.test(style) ? 'fast9' : 'flex';
      guidance.textContent = AugmentAdvisor.stages[round] + ': ' + priorities[archetype][round];
      if (shopping.nextElementSibling !== banner) banner.before(shopping);
    } else {
      guidance.textContent = openers();
      if (shopping.previousElementSibling !== workspace) workspace.after(shopping);
    }
  }

  const previous = render;
  render = function () { previous(); draw(); };
  render();
})();

/* One header, compact controls, and pointer/keyboard sorting without inventory edits. */
(()=>{
  const top=document.querySelector('.topright'),actions=document.querySelector('.actions');
  const help=top.querySelector('[data-action="help"]'),settings=document.getElementById('settings-open');
  const menu=document.createElement('details');menu.id='utility-menu';menu.className='utility-menu';
  menu.innerHTML='<summary aria-label="More options" title="More options">⋯</summary><div class="utility-options"></div>';
  menu.querySelector('.utility-options').append(help,settings);actions.append(menu);top.append(actions);document.querySelector('.pagehead').remove();
  menu.addEventListener('click',e=>{if(e.target.closest('button'))menu.removeAttribute('open');});
  document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.removeAttribute('open');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.open){menu.removeAttribute('open');menu.querySelector('summary').focus();}});
  document.getElementById('academy-tierlist').addEventListener('click',e=>{e.preventDefault();MetaReference.openPage('https://tftacademy.com/tierlist/comps','TFT Academy tierlist');});
  const reset=document.createElement('button');reset.id='reset-queue-order';reset.className='quiet';reset.textContent='Reset order';reset.title='Restore recommended order; keep current targets and inventory';
  document.querySelector('.queuehead').insertBefore(reset,document.getElementById('receive-open'));
  const queue=document.getElementById('queue');
  queue.insertAdjacentHTML('beforebegin','<span id="queue-drag-help" class="visuallyhidden">Drag to reorder. Keyboard: Space to pick up, arrows to move, Enter to drop, Escape to cancel.</span><span id="queue-sort-status" class="visuallyhidden" role="status" aria-live="polite"></span>');
  const announce=text=>document.getElementById('queue-sort-status').textContent=text;
  let drag=null,frame=0;
  const cards=()=>[...queue.querySelectorAll('.qcard')];
  const cardFor=uid=>cards().find(c=>c.dataset.queueUid===uid);
  function stop(){
    if(frame&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(frame);frame=0;
    if(drag){drag.card.classList.remove('queue-dragging');drag.card.querySelector('.queue-grip')?.setAttribute('aria-pressed','false');try{drag.handle?.releasePointerCapture(drag.pointer);}catch(e){}}
    drag=null;queue.classList.remove('is-sorting');
  }
  function begin(card,fields={}){
    if(drag||document.querySelector('dialog[open]'))return;
    drag={card,uid:card.dataset.queueUid,active:false,...fields};
  }
  function activate(){if(!drag||drag.active)return;drag.active=true;queue.classList.add('is-sorting');drag.card.classList.add('queue-dragging');drag.card.querySelector('.queue-grip').setAttribute('aria-pressed','true');announce('Moving '+byId[state.queue.find(q=>q.uid===drag.uid).item].name);}
  function preview(y){
    if(!drag?.active)return;
    const other=cards().filter(c=>c!==drag.card),before=other.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2;});
    if(drag.card.nextElementSibling!==before&&(before||queue.lastElementChild!==drag.card))queue.insertBefore(drag.card,before||null);
  }
  function scrollTick(){
    if(!drag?.active||drag.keyboard){frame=0;return;}
    const height=window.innerHeight||document.documentElement.clientHeight,edge=65,y=drag.y;
    const amount=y<edge?-Math.ceil((edge-y)/5):y>height-edge?Math.ceil((y-height+edge)/5):0;
    if(amount&&typeof window.scrollBy==='function'){window.scrollBy(0,Math.max(-20,Math.min(20,amount)));preview(y);}
    if(typeof requestAnimationFrame==='function')frame=requestAnimationFrame(scrollTick);
  }
  function finish(commit){
    if(!drag)return;const {uid,active}=drag,ids=cards().map(c=>c.dataset.queueUid);stop();
    const current=QueueOrder.pending(state).map(q=>q.uid);
    if(commit&&active&&ids.length===current.length&&ids.some((id,n)=>id!==current[n]))mutate(()=>QueueOrder.apply(state,ids),'Queue reordered.');else render();
    cardFor(uid)?.querySelector('.queue-grip')?.focus({preventScroll:true});announce(commit&&active?'Queue order saved.':'Reorder cancelled.');
  }
  reset.addEventListener('click',()=>mutate(()=>QueueOrder.reset(state),'Recommended order restored.'));
  queue.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.isPrimary===false)return;
    const card=e.target.closest('.qcard'),handle=e.target.closest('.queue-grip');
    if(!card||(!handle&&(e.pointerType!=='mouse'||!e.target.closest('.qtop')||e.target.closest('button,a,input'))))return;
    begin(card,{pointer:e.pointerId,handle:handle||card,startX:e.clientX,startY:e.clientY,y:e.clientY});
    if(!drag)return;e.preventDefault();(handle||card).focus?.({preventScroll:true});try{(handle||card).setPointerCapture(e.pointerId);}catch(error){}
  });
  document.addEventListener('pointermove',e=>{
    if(!drag||drag.keyboard||drag.pointer!==e.pointerId)return;
    if(!drag.active&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<6)return;
    e.preventDefault();activate();drag.y=e.clientY;preview(e.clientY);if(!frame&&typeof requestAnimationFrame==='function')frame=requestAnimationFrame(scrollTick);
  },{passive:false});
  document.addEventListener('pointerup',e=>{if(drag&&!drag.keyboard&&drag.pointer===e.pointerId){e.preventDefault();finish(true);}});
  document.addEventListener('pointercancel',e=>{if(drag&&drag.pointer===e.pointerId)finish(false);});
  queue.addEventListener('dragstart',e=>e.preventDefault());
  queue.addEventListener('keydown',e=>{
    const handle=e.target.closest('.queue-grip');if(!handle)return;
    if(!drag&&(e.key===' '||e.key==='Enter')){e.preventDefault();begin(handle.closest('.qcard'),{keyboard:true});activate();return;}
    if(!drag?.keyboard)return;
    if(e.key==='Escape'){e.preventDefault();finish(false);return;}
    if(e.key===' '||e.key==='Enter'){e.preventDefault();finish(true);return;}
    if(['ArrowUp','ArrowDown','Home','End'].includes(e.key)){
      e.preventDefault();const list=cards(),at=list.indexOf(drag.card),to=e.key==='Home'?0:e.key==='End'?list.length-1:Math.max(0,Math.min(list.length-1,at+(e.key==='ArrowUp'?-1:1)));
      if(to!==at){const other=list.filter(c=>c!==drag.card);queue.insertBefore(drag.card,other[to]||null);drag.card.querySelector('.queue-grip').focus({preventScroll:true});drag.card.scrollIntoView?.({block:'nearest'});announce('Position '+(to+1)+' of '+list.length);}
    }
  });
  document.addEventListener('keydown',e=>{if(drag&&e.key==='Escape'){e.preventDefault();finish(false);}});
  const previous=render;render=function(){if(drag)stop();previous();const pending=QueueOrder.pending(state),recommended=QueueOrder.recommended(state);reset.disabled=pending.every((q,n)=>q.uid===recommended[n]?.uid);};
  render();
})();

})();
</script>
