.topbar{height:auto;min-height:76px;padding:14px 24px;gap:18px;align-items:center;flex-wrap:wrap}
.brand{min-width:0;gap:10px;flex:1}

.topright{gap:0;flex:0 0 auto}

.utility-options button:hover{background:#2b3942}
.wrap{padding-top:14px}
.academy-bar{margin-top:0}

.queuehead{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.queuehead>div:first-child{flex:1 1 auto;min-width:85px}
.queuehead #reset-queue-order,.queuehead #receive-open{font-size:11px;padding:6px 8px;min-height:32px}
.qtop{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto 22px;align-items:center;gap:6px;padding:8px}
.qtop .itemtitle{min-width:0}
.qtop .itemtitle h3{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.qtop .recipe{padding:0;margin:0;gap:3px;flex-wrap:nowrap}
.qtop .recipe>.plus{font-size:10px}
.qtop .componentpill{padding:3px;gap:2px;font-size:10px;min-height:28px}
.qtop .componentpill .icon{width:20px;height:20px}
.qtop .remove{padding:0;width:22px}
.queue-grip{touch-action:none;cursor:grab;padding:0;width:24px;height:42px;min-width:0;background:transparent;border:0;color:#889bad;font-size:23px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.queue-grip:hover{background:#263441;color:#dae8f5}
.queue-champion{display:inline-flex;align-items:center;max-width:100%;gap:3px;font-size:11px;line-height:1.25;background:transparent;border:0;padding:0;text-align:left;color:var(--muted)}
.queue-champion:hover{background:transparent;color:var(--text)}
.queue-champion .inline-entity{flex-wrap:wrap;font-size:11px}
.qbottom{justify-content:space-between}
.qbottom .make{margin-left:auto}
.qcard.queue-dragging{outline:2px solid #94bddc;outline-offset:1px;opacity:.75;background:#223342}
.is-sorting,.is-sorting *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.qcard .qtop{cursor:grab}
.qcard .qtop button{cursor:pointer}
.qcard .qtop .queue-grip{cursor:grab}
@media(max-width:680px){.topbar{padding:12px;gap:12px}.brand h1{font-size:20px}.topright{width:100%}.topright .actions{justify-content:flex-end}.topright .actions>button{padding:7px 10px}.wrap{padding-top:10px}.qtop{gap:5px}.academy-order{gap:7px}}

.source-notice { color: #f0dca1; }
.finder-empty { color: var(--muted); }
.finder-empty [role="status"] { color: var(--text); font-weight: 650; }
.finder-empty ul, .comp-suggestion .finder-method ul { margin: 6px 0; padding-left: 22px; }

.live-data-warning { margin: 0 0 12px; padding: 10px 14px; border: 1px solid #c98e50; border-radius: 8px; background: #38261d; color: #ffe4b5; font-weight: 650; }
.academy-reference { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.academy-reference summary { cursor: pointer; }
.academy-reference ul { max-height: 270px; overflow: auto; padding: 0 4px; list-style: none; }
.academy-reference li { display: flex; align-items: baseline; gap: 8px; margin: 6px 0; }
.academy-reference a { color: #b8d3c5; }

/* Keep the comp, next item, carousel and augment guidance in reading order. */
.wrap{max-width:1240px}
.workspace{display:block}
.topbar{padding-inline:max(24px,calc((100% - 1168px)/2))}
#comp-fit{display:flex;align-items:center;flex-wrap:wrap;gap:5px 9px;margin-top:5px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}
#comp-fit:not([hidden])+small{display:none}
#next-build{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px 14px;margin-bottom:12px;padding:14px 18px 16px;border:1px solid #655637;border-radius:12px;background:linear-gradient(110deg,#30271d,#1b2225 72%);box-shadow:inset 3px 0 var(--gold)}
.next-build-label{grid-column:1/-1;color:var(--gold);font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
#next-build>.icon{width:48px;height:48px;border-color:#a88d59}
#next-build strong{display:block;color:#fff3d9;font-size:clamp(20px,3.2vw,31px);line-height:1.18;overflow-wrap:anywhere}
.next-build-target span,.next-build-status{display:block;color:#c9bdab;font-size:12px}
.next-build-target span{margin-top:3px}
.next-build-status{padding:4px 8px;border:1px solid #665638;border-radius:5px;text-align:center}

.shopping{position:static;width:100%;margin-bottom:10px}
.shopping .panelhead{padding:10px 12px 7px}
.shopping h2{font-size:15px;letter-spacing:0}
.shoppinglist:has(.decision-need){
  display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(115px,1fr);
  gap:6px;overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x proximity;scroll-padding-inline:10px
}
.shopping .decision-need{
  display:grid;grid-template-columns:12px 24px minmax(0,1fr) 23px;grid-template-rows:minmax(32px,auto) 32px;
  align-items:center;gap:3px;padding:4px 5px;scroll-snap-align:start
}
.shopping .pick-rank{grid-area:1/1}
.shopping .decision-need>.icon{grid-area:1/2;width:24px;height:24px}
.shopping .decision-need .needname{grid-area:1/3/2/5;min-width:0;font-size:11px;line-height:1.25}
.shopping .component-shortage{margin-left:0;font-size:11px}
.shopping .carousel-target{grid-area:2/1/3/3;justify-self:start}
.shopping .carousel-target>.icon{width:23px;height:23px}
.shopping .decision-need .pin{grid-area:2/4;font-size:16px;padding:0}
.shopping .decision-need .got{grid-area:2/2/3/4;justify-self:end;min-height:30px;padding:3px 5px;white-space:nowrap;font-size:10px}
.shoppingfoot{padding:5px 12px;font-size:10px}
.opener-banner{margin:0 0 16px;padding:8px 12px;border:1px solid #364661;border-radius:8px;background:#17212e}
.opener-banner small{display:block;color:#adbcd0;font-size:10px}
#opener-guidance{color:#e5eef9;font-size:13px;font-weight:650;white-space:nowrap;overflow-x:auto;scrollbar-width:thin}
.bench{position:static;margin-top:16px}
.academy-bar{margin-top:16px}
.pivot-section{margin:0 0 16px}
.plan-queue,.plan-overview{grid-row:auto}

@media(max-width:680px){
  .topbar{min-height:0;padding:10px 12px;gap:8px}
  .topright .actions>button{min-height:34px;font-size:11px;padding:5px 8px}
  #next-build{padding:10px 12px 12px;gap:5px 9px}
  #next-build>.icon{width:42px;height:42px}
  .next-build-status{max-width:80px;font-size:11px;padding:3px 5px}
  .shoppinglist:has(.decision-need){grid-auto-columns:124px}
  .shoppingfoot{display:none}
  .opener-banner{padding-inline:9px}
  #opener-guidance{font-size:12px}
  main:not(:has(#next-build:not([hidden]))) #opener-guidance{font-size:11px;font-weight:600;letter-spacing:-.32px}
}

<body>
<div id="app"></div>
<script>

(async () => {
  const modules = {
"./academy": (module, require) => {
'use strict';

const {academySource, validAcademy} = require('./snapshots');

module.exports = function createAcademy({DATA, ACADEMY_BUNDLED, byId, PivotPlanner, secondaryTiers, requireLive}) {
  const coreRecipes=new Map(DATA.items.filter(i=>!i.academyOnly).map(i=>[i.id,[...i.recipe]]));
  /* Public TFT Academy data. Team codes contain champions, never item builds. */
  return {
    cacheKey:'carousel-academy-v7', snapshot:ACADEMY_BUNDLED, itemMap:new Map(),
    requireLive, live:false, revision:0, liveMetaUnit:'',
    isCurrent(){return !requireLive||this.live;},
    normalizeName(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'');},
    decodeCode(text){
      const code=String(text).trim();
      const m=/^(01|02)([0-9a-f]+)TFTSet(\d+)(?:_(Act2|Stage2_Revival))?$/i.exec(code);
      if(!m)throw new Error('Paste the full in-game team code, starting with 01 or 02 and ending with TFTSet…');
      const width=m[1]==='01'?2:3;
      if(m[2].length!==10*width)throw new Error('That team code has the wrong length. Copy it again from TFT Academy.');
      const hex=m[2].toUpperCase().match(new RegExp('.{'+width+'}','g')).filter(v=>parseInt(v,16)!==0);
      if(!hex.length)throw new Error('This team code has no champions.');
      return {set:Number(m[3]),width,hex,signature:[...hex].sort().join('-')};
    },
    unpack(payload){
      if(!payload||!Array.isArray(payload.nodes))throw new Error('TFT Academy changed its data format. Your saved snapshot is still available.');
      return payload.nodes.filter(n=>n&&Array.isArray(n.data)).map(node=>{
        const values=node.data,seen=new Map();let reads=0;
        const read=index=>{
          if(!Number.isInteger(index)||index>=values.length||++reads>100000)throw new Error('Unexpected TFT Academy data.');
          if(index<0)return null;
          if(seen.has(index))return seen.get(index);
          const v=values[index];
          if(v===null||typeof v!=='object')return v;
          const out=Array.isArray(v)?[]:{};seen.set(index,out);
          if(Array.isArray(v))v.forEach(ref=>out.push(read(ref)));
          else for(const [key,ref] of Object.entries(v)){if(!['__proto__','constructor','prototype'].includes(key))out[key]=read(ref);}
          return out;
        };return read(0);
      });
    },
    guide(plan){return plan.activeComp?.guide||this.snapshot.guides.find(g=>g.id===plan.activeComp?.id);},
    currentGuide(plan){
      if(!this.isCurrent())return;
      if(!requireLive)return this.guide(plan);
      return this.snapshot.guides.find(g=>g.id===(plan.activeComp?.id||plan.activeComp?.guide?.id));
    },
    secondaryTier(guide){
      if(guide.tier!=='X')return null;
      const {set,patch}=this.snapshot;
      if(secondaryTiers?.set===set&&secondaryTiers.patch===patch){
        const badge=secondaryTiers.tiers[guide.id];
        if(/^[ABC]$/.test(badge))return {tier:badge,patch,fromXRow:true};
      }
      if(set!==ACADEMY_BUNDLED.set)return null;
      const saved=ACADEMY_BUNDLED.guides.find(g=>g.id===guide.id);
      return /^[SABC]$/.test(saved?.tier)?{tier:saved.tier,patch:ACADEMY_BUNDLED.patch}:null;
    },
    itemInfo(id){return this.snapshot.items.find(i=>this.itemMap.get(i.apiName)===id);},
    baseItem(id, snapshot=this.snapshot){
      const src=snapshot.items.find(i=>this.itemMap.get(i.apiName)===id);
      if(src?.type!=='radiants')return id;
      const name=this.normalizeName(src.name.replace(/^Radiant\s+/i,''));
      const base=snapshot.items.find(i=>i.type==='craftables'&&this.normalizeName(i.name)===name);
      return base?this.itemMap.get(base.apiName)||id:id;
    },
    itemMatches(wanted,owned){return wanted===owned||this.baseItem(owned)===wanted;},
    slotCost(id){return this.baseItem(id)==='ThiefsGloves'?3:1;},
    canEquip(plan,name,id,excludedUid){
      if(!name)return true;
      const holders=this.equipment(plan);
      const used=plan.queue.filter(q=>q.done&&q.uid!==excludedUid&&holders.get(q.uid)===name)
        .reduce((total,q)=>total+this.slotCost(q.item),0);
      return used+this.slotCost(id)<=3;
    },
    cleanGuide(g, items=this.snapshot.items){
      if(!g||!Array.isArray(g.finalComp))return null;
      const text=v=>String(v||'').slice(0,4000);
      const unit=c=>({apiName:text(c.apiName),items:(c.items||[]).filter(i=>typeof i==='string').slice(0,6),boardIndex:Number.isInteger(c.boardIndex)&&c.boardIndex>=0&&c.boardIndex<28?c.boardIndex:null,stars:Math.max(1,Math.min(3,Number(c.stars)||1))});
      const gatedBy=this.gate(g,items);
      return {gatedBy,id:text(g.id),title:text(g.title),compSlug:text(g.compSlug),tier:text(g.tier),set:Number(g.set),updated:text(g.updated),mainChampion:{apiName:text(g.mainChampion?.apiName)},mainItem:g.mainItem?.apiName?{apiName:text(g.mainItem.apiName)}:null,mainAugment:g.mainAugment?.apiName&&!g.mainAugment.disabled?{apiName:text(g.mainAugment.apiName)}:null,style:text(g.style),difficulty:text(g.difficulty),altBuilds:(g.altBuilds||[]).slice(0,40).map(unit),carousel:(g.carousel||[]).slice(0,30).map(p=>({apiName:text(p.apiName)})),earlyComp:(g.earlyComp||[]).slice(0,28).map(unit),finalComp:g.finalComp.slice(0,28).map(unit),augments:(g.augments||[]).filter(a=>a&&!a.disabled&&typeof a.apiName==='string').slice(0,60).map(a=>({apiName:text(a.apiName)})),augmentsTip:text(g.augmentsTip),tips:(g.tips||[]).slice(0,12).map(t=>({stage:text(t.stage),tip:text(t.tip)}))};
    },
    gate(guide,items=this.snapshot.items){
      const gate=guide.gatedBy;
      if(['item','emblem','augment'].includes(gate?.type)&&typeof gate.id==='string'&&/^\w+$/.test(gate.id)){
        return {type:gate.type,id:gate.id};
      }
      if(guide.tier!=='X')return null;
      if(guide.mainAugment?.apiName&&!guide.mainAugment.disabled)return {type:'augment',id:guide.mainAugment.apiName};
      const featured=items.find(i=>i.apiName===guide.mainItem?.apiName);
      if(featured&&featured.type!=='components')return {type:featured.type==='emblems'?'emblem':'item',id:featured.apiName};
      const finalItems=new Set(guide.finalComp.flatMap(unit=>unit.items||[]));
      const emblems=items.filter(i=>i.type==='emblems'&&finalItems.has(i.apiName));
      return emblems.length===1?{type:'emblem',id:emblems[0].apiName}:null;
    },
    normalize(nodes,championData,itemData,augmentData){
      const guides=nodes.find(n=>Array.isArray(n?.guides))?.guides;
      if(!guides?.length||!Array.isArray(championData?.champions)||!Array.isArray(itemData?.items))throw new Error('The live tierlist could not be read. Your saved snapshot is still available.');
      const set=Math.max(...guides.map(g=>Number(g.set)||0));
      const sourceUpdated=String(nodes.find(n=>n?.lastUpdated)?.lastUpdated||'').replace(' ','T');
      const snapshot=this.cleanSnapshot({
        patch:String(nodes.find(n=>n?.patch)?.patch||''),set,source:academySource,sourceUpdated,
        curatedAt:null,schemaVersion:1,fetchedAt:new Date().toISOString(),
        guides:guides.filter(g=>g.isPublic&&Number(g.set)===set&&Array.isArray(g.finalComp)),
        champions:championData.champions,items:itemData.items,augments:augmentData?.augments
      });
      return snapshot;
    },
    cleanSnapshot(snapshot){
      if(!validAcademy(snapshot))throw new Error('Unexpected or empty tierlist data.');
      const champions=snapshot.champions.map(c=>({
        apiName:String(c.apiName),name:String(c.name),hexIndex:String(c.hexIndex||''),
        traits:Array.isArray(c.traits)?c.traits:[],
        traitKeys:Array.isArray(c.traitKeys)?c.traitKeys:Object.keys(c.traitContributions||{}),
        role:String(c.role||''),cost:Number(c.cost)||0
      }));
      const championIds=new Map(snapshot.champions.flatMap(c=>[[c.id,c.apiName],[c.apiName,c.apiName]]));
      const items=snapshot.items.map(i=>({
        apiName:String(i.apiName),name:String(i.name),type:String(i.type),unique:!!i.unique,
        trait:String(i.trait||i.targetRules?.grantsTrait||''),composition:Array.isArray(i.composition)?i.composition:[],
        recommendedChampions:(i.recommendedChampions||[]).map(id=>championIds.get(id)).filter(Boolean),
        filterType:(i.filterType||[]).filter(t=>typeof t==='string'),description:String(i.description||'').slice(0,2000)
      }));
      const guides=snapshot.guides.map(g=>this.cleanGuide(g,items)).filter(Boolean);
      if(!guides.length)throw new Error('Unexpected or empty tierlist data.');
      return {patch:snapshot.patch,set:snapshot.set,source:academySource,sourceUpdated:String(snapshot.sourceUpdated||snapshot.updated||''),
        curatedAt:snapshot.curatedAt||null,schemaVersion:1,fetchedAt:snapshot.fetchedAt,
        guides,champions,items,augments:this.cleanAugments(snapshot.augments)};
    },
    useSnapshot(snapshot){
      this.itemMap.clear();
      this.register(snapshot,byId);
      this.snapshot=snapshot;
    },
    cleanAugments(list){
      return (Array.isArray(list)?list:[]).filter(a=>a&&!a.disabled&&typeof a.apiName==='string'&&typeof a.name==='string').slice(0,1000).map(a=>({apiName:a.apiName.slice(0,120),name:a.name.slice(0,120),description:String(a.description||'').slice(0,2000),stages:(a.stages||[]).filter(s=>typeof s==='string'),tier:Number(a.tier)||0}));
    },
    register(snapshot,index){
      const core=DATA.items.filter(i=>!i.academyOnly),components=new Set(DATA.components.map(c=>c.id));
      for(const item of core)item.recipe=[...coreRecipes.get(item.id)];
      const embedded=new Map(ACADEMY_BUNDLED.items.map(i=>[i.apiName,i.icon]));
      for(const src of snapshot.items){
        if(src.type==='components'||!/^\w+$/.test(src.apiName))continue;
        const match=core.find(i=>this.normalizeName(i.name)===this.normalizeName(src.name));
        if(match){const recipe=src.composition.map(c=>String(c).replace(/^DA_Component_|^TFT_Item_/,''));if(recipe.length===2&&recipe.every(c=>components.has(c)))match.recipe=recipe;this.itemMap.set(src.apiName,match.id);continue;}
        const recipe=src.composition.map(c=>String(c).replace(/^DA_Component_|^TFT_Item_/,''));
        const craftable=recipe.length===2&&recipe.every(c=>components.has(c));
        const id='Academy_'+src.apiName;
        const item={id,name:src.name,recipe:craftable?recipe:[],special:!craftable,academyOnly:true,icon:embedded.get(src.apiName)||'https://assets.tftacademy.com/items/'+encodeURIComponent(src.apiName)+'.webp'};
        const existing=DATA.items.find(i=>i.id===id);
        if(existing)Object.assign(existing,item);else DATA.items.push(item);
        if(index)index[id]=existing||item;
        this.itemMap.set(src.apiName,id);
      }
      const champions=new Map(snapshot.champions.map(c=>[c.apiName,c]));
      for(const item of snapshot.items){
        const id=this.itemMap.get(item.apiName);
        if(id&&byId[id]?.academyOnly)PivotPlanner.register(id,item,this.baseItem(id,snapshot),champions);
      }
    },
    guideHex(guide,width=3){
      const champs=new Map(this.snapshot.champions.map(c=>[c.apiName,c]));
      return guide.finalComp.map(c=>champs.get(c.apiName)).filter(c=>c?.hexIndex&&c.traits.length&&c.apiName!=='TFT16_AnnieTibbers').slice(0,10).map(c=>c.hexIndex.toUpperCase().padStart(width,'0').slice(0,width));
    },
    match(text){
      const code=this.decodeCode(text);
      if(code.set!==this.snapshot.set)throw new Error(`This code is Set ${code.set}; the loaded tierlist is Set ${this.snapshot.set}. Refresh the tierlist for Set ${code.set} to match it.`);
      const known=new Map(this.snapshot.champions.filter(c=>c.hexIndex).map(c=>[c.hexIndex.toUpperCase().padStart(code.width,'0').slice(0,code.width),c.name]));
      const unknown=code.hex.filter(h=>!known.has(h));
      if(unknown.length)throw new Error('This code contains unrecognized champions. Refresh the tierlist, or check that you copied a current team code.');
      const matches=this.snapshot.guides.map(g=>{
        const hex=this.guideHex(g,code.width),pool=[...hex];let shared=0;
        for(const id of code.hex){const at=pool.indexOf(id);if(at>=0){shared++;pool.splice(at,1);}}
        return {guide:g,exact:[...hex].sort().join('-')===code.signature,shared,total:hex.length,score:2*shared/(hex.length+code.hex.length)};
      }).filter(m=>m.shared>=Math.max(2,Math.ceil(code.hex.length*.6))).sort((a,b)=>Number(b.exact)-Number(a.exact)||b.score-a.score);
      const exact=matches.filter(m=>m.exact);
      return {code,names:code.hex.map(h=>known.get(h)),matches:exact.length?exact:matches.slice(0,5),exact:exact.length>0};
    },
    build(guide){
      const names=new Map(this.snapshot.champions.map(c=>[c.apiName,c.name]));
      const units=[...guide.finalComp].sort((a,b)=>Number(b.apiName===guide.mainChampion.apiName)-Number(a.apiName===guide.mainChampion.apiName));
      const entries=[],missing=[];
      for(const unit of units)for(const apiName of unit.items){
        const item=this.itemMap.get(apiName),champion=names.get(unit.apiName)||unit.apiName;
        if(item)entries.push({item,champion,sourceComp:guide.title,sourceURL:'https://tftacademy.com/tierlist/comps/'+encodeURIComponent(guide.compSlug)});
        else missing.push({name:this.snapshot.items.find(i=>i.apiName===apiName)?.name||apiName,champion});
      }
      // The displayed Item Priority list lives in `carousel`, independently of
      // board slot order. Promote one copy per listed item, never every duplicate.
      const priorities=this.priorities(guide),available=[...entries],chosen=new Map();
      priorities.forEach((p,n)=>{
        if(p.component)return;
        const at=available.findIndex(e=>e.item===p.id);
        if(at>=0)chosen.set(n,available.splice(at,1)[0]);
      });
      const ordered=[];
      // A component wishlist does not define a finished-item build order. Use
      // the guide's explicit early-board builds before inferring from recipes.
      if(priorities.every(p=>p.component)){
        for(const unit of guide.earlyComp||[])for(const apiName of unit.items||[]){
          const item=this.itemMap.get(apiName);if(!item)continue;
          const at=available.findIndex(e=>e.item===item);
          if(at>=0){const entry=available.splice(at,1)[0];ordered.push({...entry,earlyChampion:names.get(unit.apiName)||unit.apiName});}
        }
      }
      priorities.forEach((p,n)=>{
        if(chosen.has(n)){ordered.push(chosen.get(n));return;}
        if(!p.component)return;
        // A component preference advances an existing recipe. It does not add
        // another item or reserve a phantom extra component from the bench.
        const at=available.findIndex(e=>DATA.items.find(i=>i.id===e.item)?.recipe.includes(p.id));
        if(at>=0)ordered.push(available.splice(at,1)[0]);
      });
      return {entries:[...ordered,...available],missing,priorities};
    },
    itemizationOrder(guide){
      if(!guide||!this.priorities(guide).length)return [];
      const holders=this.build(guide).entries.map(entry=>entry.champion);
      return [...new Set(holders)].map(name=>[name]);
    },
    equipment(plan){
      const done=plan.queue.filter(q=>q.done),holders=new Map(done.map(q=>[q.uid,q.champion||'']));
      const guide=this.currentGuide(plan);
      if(!guide)return holders;
      const names=new Set(guide.finalComp.map(c=>this.snapshot.champions.find(x=>x.apiName===c.apiName)?.name));
      const entries=[...this.build(guide).entries],pool=[],slots=new Map();
      const reserve=(name,id)=>slots.set(name,(slots.get(name)||0)+this.slotCost(id));
      for(const q of done){

"./augment-advisor": (module, require) => {
'use strict';

module.exports = function createAugmentAdvisor({Academy, CompFinder, Tracker, DATA}) {
  /* Evidence-led offer comparison. Academy endorsements are the strongest signal.
     Description-based adjustments are explicitly local heuristics. Neither these
     scores nor the candidate catalog represent win rates or a reroll distribution. */
  return {
    stages:['2-1','3-2','4-2'],

    slots(plan){return [plan.firstAugment||plan.chosenAugments?.[0]||'',plan.chosenAugments?.[1]||'',plan.chosenAugments?.[2]||''];},

    eligible(a,round){return !a.stages?.length||a.stages.includes(this.stages[round]);},
    catalog(plan,round){const held=new Set(this.held(plan));return (Academy.snapshot.augments||[]).filter(a=>!held.has(a.apiName)&&this.eligible(a,round)).sort((a,b)=>a.name.localeCompare(b.name));},

      return matches.length?'No remaining matches for this offer.':'Limited evidence · No TFT Academy entry matches this name.';
    },

      const units=CompFinder.units(plan),pending=plan.queue.filter(q=>!q.done),done=plan.queue.filter(q=>q.done),needs=Tracker.allocate(plan,DATA.items).needs;

    },

      if(guide&&endorses(guide)){

      }else if(!guide){

        if(options.length){
          const best=options[0],nearBest=ctx.routes[0]?.fitScore||0,closeness=Math.max(0,1-Math.max(0,nearBest-best.adjusted)/50);
          add(14+closeness*20,'Academy match: '+best.guide.title);evidence=2;links.push(best.guide);
          if(best.keepers.length||best.matched.length||best.specialMatches.length){add(Math.min(9,best.unitScore/6+best.itemScore/12),'That route fits your recorded units or completed items');}
        }
      }
      const text=a.description||'',lower=text.toLowerCase(),normal=Academy.normalizeName(text),style=(guide?.style||ctx.routes[0]?.guide.style||'').toLowerCase();
      // Explicit item names provide a narrow, auditable connection. No inferred
      // inventory grants; an offer and even a chosen augment are not receipts.
      const referenced=DATA.items.filter(i=>i.name.length>5&&normal.includes(Academy.normalizeName(i.name)));
      const ownedRefs=referenced.filter(i=>done.some(q=>Academy.itemMatches(i.id,q.item))),targetRefs=referenced.filter(i=>pending.some(q=>q.item===i.id));
      const reward=/\bgain\b|choose .*items?|item anvil/i.test(text),itemBuff=/grant|always give|permanently gain|holders|your .*gain/i.test(text);
      if(ownedRefs.length&&itemBuff){add(12,'Works with an item you already own');evidence=Math.max(evidence,1);}
      else if(targetRefs.length&&reward){add(9,'Mentions an item in your build queue');evidence=Math.max(evidence,1);}

      if(/cannot choose your carousel/.test(lower)&&Object.values(needs).reduce((s,n)=>s+n.count,0)>0){add(-8,'Gives up choosing the carousel components you need');conflict=true;evidence=Math.max(evidence,1);}
      if(/permanently transform/.test(lower)&&units.some(u=>u.stars>=2)){add(-10,'Transforms your recorded upgraded units');conflict=true;evidence=Math.max(evidence,1);}
      if(!reasons.length)reasons.push({points:0,text:'No specific match in the available data'});

      return {augment:a,score,evidence,conflict,reasons,links,items:[...new Set([...ownedRefs,...targetRefs].map(i=>i.id))],components:parts,invalid:false};
    },
    compare(plan,offers=this.ensure(plan)){
      const ctx=this.context(plan),round=offers.round,rows=offers.ids.map((id,slot)=>({a:CompFinder.augment(id),slot})).filter(x=>x.a).map(({a,slot})=>({...this.evaluate(a,ctx,round),slot})).sort((a,b)=>b.score-a.score||a.slot-b.slot);

        const alternatives=this.catalog(plan,round).filter(a=>!seen.has(a.apiName)).map(a=>this.evaluate(a,ctx,round));

        // will appear. Missing annotations alone never justify a reroll.

        const better=weakest&&alternatives.filter(r=>r.augment.tier===weakest.augment.tier&&r.evidence>=2&&r.score>=best.score+16&&r.score>=32).sort((a,b)=>b.score-a.score)[0];
        if(!complete){action='partial';message=offers.ids.every(Boolean)
          ?'Some offers have limited round evidence. The supported fit is shown below.'
          :'Add all three offers to compare. Current best fit shown below.';}
        else if(best.score>=38&&best.evidence>=2){action='take';message='Take '+best.augment.name+' — strongest supported fit.';}
        else if(better&&weakest){action='reroll';reroll={slot:weakest.slot,example:better};message='Consider rerolling '+weakest.augment.name+' if available. Keep '+best.augment.name+' as your fallback.';}
        else if(best.evidence>0&&best.score>=8){action='lean';message='Lean '+best.augment.name+'. No strong reason to spend a reroll from the available data.';}

    },

    }
  };
};

},
"./backup": (module, require) => {
'use strict';

const createModel = require('./model');
const {validAcademy} = require('./snapshots');

const maxBackupBytes = 5_000_000;

function exportBackup(model, state, shortcuts) {
  return JSON.stringify({
    app: 'carousel-offline', version: 1, exportedAt: new Date().toISOString(), state, shortcuts,
    academy: model.Academy.cleanSnapshot(model.Academy.snapshot)
  });
}

function reviewBackup(model, text) {
  if (new TextEncoder().encode(text).byteLength > maxBackupBytes) {
    throw new Error('Choose a backup smaller than 5 MB.');
  }
  const raw = JSON.parse(text);
  if (!raw || raw.app && raw.app !== 'carousel-offline' || raw.version && raw.version !== 1) {
    throw new Error('This is not a supported Carousel backup.');
  }
  const academy = validAcademy(raw.academy) ? model.Academy.cleanSnapshot(raw.academy) : null;
  // A review validates newer item IDs without registering them in the active game.
  const tracker = academy ? createModel({core: model.DATA, academy, meta: {units: []}}).OfflineTracker
    : model.OfflineTracker;
  return {state: tracker.cleanState(raw.state || raw), shortcuts: raw.shortcuts, academy};
}

module.exports = {exportBackup, reviewBackup, maxBackupBytes};

},

        const targets=(planned[id]||[]).slice().sort((a,b)=>holderRank(a.champion)-holderRank(b.champion)||a.rank-b.rank),alternatives=pivots[id]||[],baseline=needs[id],priority=Academy.componentPreference(plan,id);
        const carrierRank=targets.length?holderRank(targets[0].champion):Infinity;
        let gain=0,score=0,best={actions:[]};
        if(baseline){
          const after={...plan,owned:{...plan.owned,[id]:(plan.owned[id]||0)+1}};
          const context=baselineFor(carrierRank);

          const reach=targets.reduce((sum,t)=>sum+3*Math.max(1,6-t.rank),0);
          score=gain+Math.min(20,reach)+3-(Number.isFinite(priority)?Math.min(priority,20)*.15:0);
        }else if(alternatives.length){
          const b=alternatives[0];score=(b.tier==='S'?20:10)+Math.max(0,Math.min(2,b.score))-Math.min(6,b.missing)*.1;
        }
        return {id,score,gain,best,carrierRank,pivot:!!alternatives.length,pivotTier:alternatives[0]?.tier||'',targets,pivotTargets:alternatives,count:baseline?.count||0,rank:baseline?.rank??99,items:baseline?.items||[],finishes:targets};
      }).sort((a,b)=>Number(b.count>0)-Number(a.count>0)||Number(plan.pins.includes(b.id))-Number(plan.pins.includes(a.id))||b.count-a.count||(a.count&&b.count?a.carrierRank-b.carrierRank:0)||b.score-a.score||LootTracker.compare(plan,a.id,b.id)||componentOrder.indexOf(a.id)-componentOrder.indexOf(b.id));
    },
    discovery(plan){
      const candidates=CompFinder.ranked(plan,{allowSparse:true}).filter(r=>!r.blocked).slice(0,8);
      return componentOrder.slice(0,8).map(id=>{
        let score=0;const items=new Set(),routes=[];
        for(const r of candidates){
          const pending=r.remaining||r.build.entries,pool={...plan.owned};let best=0;
          for(const e of pending.slice(0,6)){
            const recipe=byId[e.item]?.recipe||[];if(!recipe.includes(id))continue;
            const need=OfflineTracker.recipeCounts(byId[e.item]);if((need[id]||0)<=(pool[id]||0))continue;

      }).sort((a,b)=>Number(plan.pins.includes(b.id))-Number(plan.pins.includes(a.id))||b.score-a.score||LootTracker.compare(plan,a.id,b.id)||componentOrder.indexOf(a.id)-componentOrder.indexOf(b.id));

    anvil(plan,type='ornns'){

      const bases=new Map(guides.map(g=>[g.id,Academy.build(g).entries]));
      return CompFinder.ownedCatalog().filter(i=>i.type===type).map(item=>{
        let best={score:0,champion:'',reason:'No supported match',guide:null};
        for(const g of guides){

            const name=Academy.snapshot.champions.find(c=>c.apiName===u.apiName)?.name;if(!name)continue;
            const eq=guide?this.equipped(plan,name):[];
            if(eq.reduce((n,id)=>n+CompFinder.slotCost(id),0)+CompFinder.slotCost(item.id)>3||item.unique&&eq.includes(item.id)||item.type==='emblems'&&item.trait&&(MetaBuilds.champion(name)?.traitKeys||[]).includes(item.trait))continue;

            const exact=targets.some(e=>Academy.itemMatches(e.item,item.id));
            const alt=(g.altBuilds||[]).some(a=>a.apiName===u.apiName&&a.items.some(api=>Academy.itemMatches(Academy.itemMap.get(api),item.id)));
            const endorsed=item.recommendedChampions?.includes(u.apiName);
            let score=exact?55:alt?47:endorsed?32:0,reason=exact?'Academy target':alt?'Academy alternate':endorsed?'Academy item guide':'No supported match';
            if(!score)continue;
            if(!guide){const fit=ranked.find(r=>r.guide.id===g.id);score+=Math.max(-15,Math.min(20,(fit?.fitScore||0)/4));}
            if(u.apiName===g.mainChampion?.apiName)score+=3;
            if(score>best.score)best={score,champion:name,reason,guide:g};
          }
        }
        if(guide)for(const name of names){const b=this.pivot(plan,name,item.id);if(b){const score=(b.tier==='S'?62:53)+Math.min(3,b.score)+b.retained; if(score>best.score)best={score,champion:name,reason:'MetaTFT '+b.tier+' combination',guide,build:b};}}
        return {item,...best};
      }).sort((a,b)=>b.score-a.score||a.item.name.localeCompare(b.item.name));
    },
    receiveAnvil(plan,row){
      if(row.component&&componentOrder.slice(0,8).includes(row.item.id)){LootTracker.gain(plan,row.item.id,'other');return;}
      const id=row.item.id,name=row.champion||'';
      // Endorsements are suggestions for holders, not fabricated equipment.
      // Reuse an exact target when possible; otherwise leave the receipt unassigned.
      const target=plan.queue.find(q=>!q.done&&q.item===id&&(!name||this.same(q.champion,name))&&Academy.canEquip(plan,q.champion,id));
      if(target)OfflineTracker.receive(plan,target);
      else plan.queue.push({uid:crypto.randomUUID(),item:id,done:true,received:true,used:{},usedSources:{},champion:''});
    }
  };
};

},
"./loot-tracker": (module, require) => {
'use strict';

module.exports = function createLootTracker({componentOrder}) {
  /* Source history is independent of inventory. This is a conservative historical
     bag heuristic, not a verified current-set probability model. */
  return {
    clean(value, owned) {
      const sources=['loot','carousel','other'];
      const count=n=>Number.isFinite(Number(n))?Math.max(0,Math.min(9999,Math.floor(Number(n)))):0;
      return {complete:value?.complete===true,counts:Object.fromEntries(componentOrder.map(id=>[id,count(value?.counts?.[id])])),loose:Object.fromEntries(componentOrder.map(id=>[id,Array.from({length:Math.min(9999,count(owned[id]))},(_,n)=>sources.includes(value?.loose?.[id]?.[n])?value.loose[id][n]:'other')]))};
    },
    ensure(plan) {
      if(!plan.lootHistory)plan.lootHistory={complete:!plan.queue.some(q=>q.done)&&!Object.values(plan.owned).some(n=>n>0),counts:{},loose:{}};
      for(const id of componentOrder){const n=plan.owned[id]||0,arr=plan.lootHistory.loose[id]||=[];while(arr.length<n)arr.push('other');if(arr.length>n)arr.length=n;}
      return plan.lootHistory;
    },
    gain(plan,id,source='loot') {
      if((plan.owned[id]||0)>=99)return;
      const h=this.ensure(plan);if(!componentOrder.slice(0,8).includes(id))source='other';
      h.loose[id].push(source);if(source==='loot')h.counts[id]=(h.counts[id]||0)+1;
      plan.owned[id]=(plan.owned[id]||0)+1;
    },
    remove(plan,id) {
      if(!(plan.owned[id]>0))return;
      const h=this.ensure(plan),source=h.loose[id].pop();
      if(source==='loot')h.counts[id]=Math.max(0,(h.counts[id]||0)-1);
      plan.owned[id]--;
    },
    take(plan,id) {return this.ensure(plan).loose[id].shift()||'other';},
    compare(plan,x,y) {
      const h=plan.lootHistory;if(!h?.complete||plan.lootTieBreak===false||!componentOrder.slice(0,8).includes(x)||!componentOrder.slice(0,8).includes(y))return 0;
      // More prior natural drops => prefer taking this equally urgent component
      // now. No percentages, stage refill assumptions, or promised future drops.
      return (h.counts[y]||0)-(h.counts[x]||0);
    }
  };
};

},
"./meta-builds": (module, require) => {
'use strict';

const {decodeMetaSnapshot} = require('./snapshots');

module.exports = function createMetaBuilds({DATA, byId, Academy, OfflineTracker, PivotPlanner, meta}) {
  const cache=new Map();
  const freshness=15*60000;
  const key=entry=>JSON.stringify([entry.unit,entry.set,entry.patch]);
  const remember=(entry,source)=>{
    const id=key(entry),prior=cache.get(id);
    if(!prior||source==='live'||entry.updated>=prior.entry.updated)cache.set(id,{entry,source});
  };
  for(const entry of decodeMetaSnapshot(meta).units)remember(entry,'bundled');

  /* Champion build rankings from MetaTFT's public unit statistics.
     Snapshot filters: current patch, ranked, Platinum+, last 3 days, three equipped items.
     Confidence, frequency and tier normalization follow the unit page's model. */
  return {
    freshness,
    compact(overall, detail, verifiedPatch) {
      if(!overall||!detail||overall.unit!==detail.unit||overall.tft_set!==detail.tft_set||!Array.isArray(overall.levels)||!Array.isArray(detail.builds)||!Array.isArray(detail.items))throw Error('Unrecognized MetaTFT data');
      const sum=a=>a.reduce((s,n)=>s+n,0), total=p=>sum(p.map((n,i)=>n*(i+1)));
      const levels=overall.levels.filter(r=>Number(r.lvl_items[0])<=4&&Number(r.lvl_items[1])===3);
      const count=sum(levels.map(r=>sum(r.places))), mean=sum(levels.map(r=>total(r.places)))/count;
      const popular=Math.max(...detail.items.map(r=>sum(r.places)));
      if(!count||!popular||!Number.isFinite(mean))throw Error('Empty MetaTFT data');
      const builds=detail.builds.flatMap(r=>{
        if(!Array.isArray(r.places)||r.places.length!==8||r.places.some(n=>!Number.isFinite(n)||n<0)||typeof r.buildNames!=='string')return [];
        const games=sum(r.places),items=r.buildNames.split('|');
        if(!games||games>=count)return [];
        const avg=total(r.places)/games, variance=sum(r.places.map((n,i)=>n*(i+1-avg)**2))/games;
        const confidenceAvg=avg+1.282*Math.sqrt(variance/games);
        const comparison=(mean*count-avg*games)/(count-games);
        const popularity=Math.min(1,Math.sqrt(games/count/.01))*(items.length/3)**2/(r.buildNames.includes('ThiefsGloves')?30:1);
        const score=(.5-(confidenceAvg-comparison))*.7*popularity*(games/popular)**.1;
        return [{items,games,avg,score}];
      }).sort((a,b)=>b.score-a.score);
      const third=builds[Math.min(2,builds.length-1)]?.score;
      const scale=third>0&&third<.35?.35/third:1;
      for(const b of builds){b.score*=scale;b.tier=b.score>=.35?'S':b.score>=.25?'A':b.score>=.15?'B':b.score>=.05?'C':'D';b.score=+b.score.toFixed(5);b.avg=+b.avg.toFixed(3);}
      return {unit:detail.unit,set:detail.tft_set,patch:verifiedPatch||String(detail.build_games?.[0]?.patch||''),rankFilter:detail.filter_adjustment?.rank_filter||'ALL',updated:Math.min(Number(overall.updated)||0,Number(detail.updated)||0),builds:builds.filter(b=>b.items.length===3&&b.games>=30)};
    },
    isCurrentSet(data){return data?.set==='TFTSet'+Academy.snapshot.set;},
    isCompatible(data){
      return Academy.isCurrent()&&this.isCurrentSet(data)&&!!data.patch&&data.patch===Academy.snapshot.patch&&
        (!Academy.requireLive||data.revision===Academy.revision&&Date.now()-data.fetchedAt<freshness);
    },
    cache(entry,source){
      if(typeof entry?.unit!=='string'||typeof entry.set!=='string'||typeof entry.patch!=='string'||
          !Number.isFinite(entry.updated)||!Array.isArray(entry.builds)||!entry.builds.every(b=>
            Array.isArray(b.items)&&b.items.length===3&&b.items.every(i=>typeof i==='string')&&
            Number.isFinite(b.score)&&Number.isFinite(b.avg)&&Number.isFinite(b.games)&&/^[SABCD]$/.test(b.tier)))return;
      const revision=source==='live'?Academy.revision:undefined;
      remember({...entry,revision},source);
    },
    cached(){return [...cache.values()].filter(r=>r.source!=='bundled'&&this.isCurrentSet(r.entry)).map(r=>r.entry);},
    invalidate(unit){
      const entry=cache.get(key({unit,set:'TFTSet'+Academy.snapshot.set,patch:Academy.snapshot.patch}));
      if(entry?.source==='live'){
        entry.entry={...entry.entry,revision:undefined};
        entry.source='saved';
      }
    },
    find(champion,allowStale=false){
      const unit=this.champion(champion)?.apiName;
      const set='TFTSet'+Academy.snapshot.set,patch=Academy.snapshot.patch;
      const matching=cache.get(key({unit,set,patch}));
      if(this.isCompatible(matching?.entry))return matching;
      if(!allowStale)return;
      return [...cache.values()].filter(r=>r.entry.unit===unit&&this.isCurrentSet(r.entry))
        .sort((a,b)=>b.entry.updated-a.entry.updated)[0];
    },
    dataFor({champion}){return this.find(champion)?.entry;},
    referenceBuilds(name,data=this.find(name,true)?.entry){
      if(!this.isCurrentSet(data)||data.unit!==this.champion(name)?.apiName)return [];
      const seen=new Set();
      return data.builds.filter(b=>['S','A'].includes(b.tier))
        .sort((a,b)=>'SA'.indexOf(a.tier)-'SA'.indexOf(b.tier)||b.score-a.score||b.games-a.games)
        .flatMap(b=>{
          const ids=b.items.map(id=>Academy.itemMap.get(id));
          if(ids.some(id=>!byId[id]))return [];
          const signature=[...ids].sort().join('|');

    },
    champion(name){return name&&Academy.snapshot.champions.find(c=>Academy.normalizeName(c.name)===Academy.normalizeName(name));},
    equipment(plan){return Academy.equipment(plan);},
    fits(build,items){const remaining=[...build];for(const id of items){const at=remaining.indexOf(id);if(at<0)return false;remaining.splice(at,1);}return true;},
    ranked(plan,uid,snapshot,{craftableOnly=false,strongOnly=false}={}){
      const target=plan.queue.find(q=>q.uid===uid&&!q.done),original=target&&byId[target.item];
      const unit=target&&this.champion(target.champion||'');
      if(!original||original.special||original.academyOnly||!unit||snapshot?.unit!==unit.apiName||!this.isCompatible(snapshot))return [];
      const same=(a,b)=>Academy.normalizeName(a)===Academy.normalizeName(b),holders=this.equipment(plan);
      // Only equipped/completed items are commitments. Pending targets are plans,
      // never fabricated equipment and never a reason to fall back to role tags.
      const equipped=plan.queue.filter(q=>q.done&&same(holders.get(q.uid),target.champion)).map(q=>q.item);
      const planned=plan.queue.filter(q=>!q.done&&q.uid!==uid&&same(q.champion,target.champion)).map(q=>q.item);
      if(equipped.reduce((slots,id)=>slots+Academy.slotCost(id),0)>=3)return [];
      const count=(list,id)=>list.filter(x=>x===id).length;
      const candidates=DATA.items.filter(i=>!i.academyOnly&&i.id!==original.id&&i.recipe.length===2&&(!craftableOnly||OfflineTracker.canCraft(plan.owned,i)));
      const best=new Map();
      for(const build of snapshot.builds){
        if(strongOnly&&(!['S','A'].includes(build.tier)||build.games<100))continue;
        const mapped=build.items.map(id=>Academy.itemMap.get(id));
        if(mapped.some(id=>!id)||mapped.reduce((slots,id)=>slots+Academy.slotCost(id),0)>3||!this.fits(mapped,equipped))continue;
        // A replacement build must actually replace this copy of the target.
        if(count(mapped,original.id)>count([...equipped,...planned],original.id))continue;
        // Do not recommend a route whose strength depends on an unowned artifact,
        // radiant item or other item that cannot be crafted from components.
        if(mapped.some(id=>byId[id].recipe.length!==2&&count(mapped,id)>count(equipped,id)))continue;
        for(const item of candidates){
          if(!this.fits(mapped,[...equipped,item.id]))continue;
          // Don't duplicate a future target unless the ranked build supports it.
          if(count(mapped,item.id)<count([...equipped,...planned],item.id)+1)continue;
          const remaining=[...mapped];for(const id of [...equipped,item.id])remaining.splice(remaining.indexOf(id),1);
          let plannedMatches=0;for(const id of planned){const at=remaining.indexOf(id);if(at>=0){plannedMatches++;remaining.splice(at,1);}}
          const choice={item,source:'meta',tier:build.tier,score:build.score,games:build.games,build:mapped,equipped,plannedMatches,updated:snapshot.updated,rankFilter:snapshot.rankFilter,unit:unit.apiName};
          const prior=best.get(item.id);if(!prior||this.compare(choice,prior)<0)best.set(item.id,choice);
        }
      }
      return [...best.values()].sort((a,b)=>this.compare(a,b));
    },
    compare(a,b){const tier={S:0,A:1,B:2,C:3,D:4};return tier[a.tier]-tier[b.tier]||b.score-a.score||b.plannedMatches-a.plannedMatches||b.games-a.games||a.item.name.localeCompare(b.item.name);},
    suggest(plan,uid,snapshot){
      const target=plan.queue.find(q=>q.uid===uid&&!q.done),original=target&&byId[target.item];
      if(!original||original.special||original.academyOnly||OfflineTracker.canCraft(plan.owned,original))return null;
      if(target.champion){
        // No generic fallback for a named champion, including offline/no-match.
        return this.ranked(plan,uid,snapshot,{craftableOnly:true,strongOnly:true})[0]||null;
      }
      const roles=PivotPlanner.profile(original.id).filter(r=>r!=='flex');
      const candidates=PivotPlanner.suggest(plan,uid,DATA.items,{role:'all'}).filter(r=>!r.item.academyOnly&&OfflineTracker.canCraft(plan.owned,r.item)&&PivotPlanner.profile(r.item.id).some(role=>roles.includes(role)));
      return candidates.length?{item:candidates[0].item,source:'similar'}:null;
    }
  };
};

},
"./model": (module, require) => {
'use strict';

const academyTier = require('./tiers');
const createAcademy = require('./academy');
const createLootTracker = require('./loot-tracker');
const createTracker = require('./tracker');
const createOfflineTracker = require('./offline-tracker');
const createQueueOrder = require('./queue-order');
const createPivotPlanner = require('./pivot-planner');
const createQuickImport = require('./quick-import');
const createMetaBuilds = require('./meta-builds');
const createPlanAdvisor = require('./plan-advisor');
const createCompFinder = require('./comp-finder');
const createDecisionPlanner = require('./decision-planner');
const createAugmentAdvisor = require('./augment-advisor');

const componentOrder = [
  'BFSword', 'RecurveBow', 'NeedlesslyLargeRod', 'TearOfTheGoddess', 'ChainVest',
  'NegatronCloak', 'GiantsBelt', 'SparringGloves', 'Spatula', 'FryingPan'
];

module.exports = function createModel({core, academy, meta, secondaryTiers, requireLive = false}) {
  const DATA = structuredClone(core);
  const byId = Object.fromEntries([...DATA.components, ...DATA.items].map(i => [i.id, i]));
  const model = {DATA, byId, componentOrder, academyTier, ACADEMY_BUNDLED: academy, requireLive};
  model.LootTracker = createLootTracker(model);
  model.Tracker = createTracker(model);
  model.PivotPlanner = createPivotPlanner(model);
  model.Academy = createAcademy({...model, secondaryTiers});
  model.QueueOrder = createQueueOrder(model);
  model.Academy.register(academy, byId);
  model.OfflineTracker = createOfflineTracker(model);
  model.QuickImport = createQuickImport(model);
  model.MetaBuilds = createMetaBuilds({...model, meta});
  model.PlanAdvisor = createPlanAdvisor(model);
  model.CompFinder = createCompFinder(model);
  model.DecisionPlanner = createDecisionPlanner(model);
  model.AugmentAdvisor = createAugmentAdvisor(model);
  return model;
};

},
"./offline-tracker": (module, require) => {

module.exports = function createOfflineTracker({DATA, byId, Academy, Tracker, LootTracker, componentOrder}) {
  /* Manual tracker helpers. No network access or game connection. */
  return {
    cleanState(value) {
      if (!value || !Array.isArray(value.queue) || typeof value.owned !== 'object' || !value.owned) throw new Error('Choose a Carousel backup or tracker state.');

      const valid = new Set(DATA.items.map(i => i.id));
      if (value.queue.some(q => !q || !valid.has(q.item))) throw new Error('This backup includes an item this version does not support.');

      return {
        currentUnits:[...new Map((Array.isArray(value.currentUnits)?value.currentUnits:[]).filter(u=>u&&typeof u.apiName==='string'&&Academy.snapshot.champions.some(c=>c.apiName===u.apiName)).slice(0,28).map(u=>[u.apiName,{apiName:u.apiName,stars:Math.max(1,Math.min(3,Math.floor(Number(u.stars)||1)))}])).values()],
        chosenAugments:Array.from({length:3},(_,n)=>typeof value.chosenAugments?.[n]==='string'?value.chosenAugments[n].slice(0,120):''),
        augmentOffers:value.augmentOffers&&typeof value.augmentOffers==='object'?{round:Math.max(0,Math.min(2,Math.floor(Number(value.augmentOffers.round)||0))),ids:Array.from({length:3},(_,n)=>typeof value.augmentOffers.ids?.[n]==='string'?value.augmentOffers.ids[n].slice(0,120):''),seen:(Array.isArray(value.augmentOffers.seen)?value.augmentOffers.seen:[]).filter(id=>typeof id==='string').map(id=>id.slice(0,120)).slice(0,60)}:null,
        tempo:value.tempo==='urgent'?'urgent':'balanced',
        pivotIntents:Object.fromEntries(Object.entries(value.pivotIntents||{}).filter(([name,ids])=>name.length<120&&Array.isArray(ids)).map(([name,ids])=>[name,ids.filter(id=>valid.has(id)).slice(0,3)])),
        firstAugment:typeof value.firstAugment==='string'?value.firstAugment.slice(0,120):'',

"./plan-advisor": (module, require) => {
'use strict';

module.exports = function createPlanAdvisor(model) {
  const {Academy, MetaBuilds, QuickImport} = model;
  /* Academy defines the plan. MetaTFT can propose an explicit, reversible
     adjustment around items the player has actually equipped. */
  return {
    same(a,b){return Academy.normalizeName(a)===Academy.normalizeName(b);},
    equipped(plan,name){const holders=Academy.equipment(plan);return plan.queue.filter(q=>q.done&&this.same(holders.get(q.uid)||'',name));},
    suggest(plan,name){
      const {DecisionPlanner, CompFinder}=model;
      const guide=Academy.currentGuide(plan),equipped=DecisionPlanner.equipped(plan,name),targets=DecisionPlanner.pending(plan,name);
      if(!guide||!equipped.length||!targets.length)return null;
      if(equipped.reduce((n,id)=>n+CompFinder.slotCost(id),0)>=3)return {champion:name,equipped,remaining:[],kind:'full'};
      const baseline=Academy.build(guide).entries.filter(q=>DecisionPlanner.same(q.champion,name)).map(q=>q.item);
      if(DecisionPlanner.subtract(baseline,equipped)!==null)return null;
      const options=DecisionPlanner.builds(plan,name),best=options[0];if(!best)return null;
      const ids=targets.map(q=>q.item),current=options.find(b=>b.remaining.length===ids.length&&MetaBuilds.fits(b.remaining,ids));
      if(current&&(current===best||best.missing>=current.missing-2))return null;
      return best;
    },
    apply(plan,choice){model.DecisionPlanner.applyBuild(plan,choice);return true;},
    restoreAcademy(plan){
      const guide=Academy.currentGuide(plan);if(!guide)return;
      QuickImport.replace(plan,{guide,entries:Academy.build(guide).entries,priorities:Academy.priorities(guide)},plan.activeComp.code);
    }
  };
};

},
"./queue-order": (module, require) => {
'use strict';

module.exports = function createQueueOrder({Academy}) {
  /* Recommended positions belong to item copies; drag only changes presentation order. */
  return {
    ensure(plan){
      // One-time upgrade: recover Academy's order for older files that did not
      // store recommended positions. Preserve every current target, including pivots.
      if(plan.queue.length&&!plan.queue.some(q=>Number.isFinite(q.recommendedOrder))){
        const guide=Academy.guide(plan),entries=guide?Academy.build(guide).entries.map((e,rank)=>({...e,rank})):[];
        if(entries.length){
          const remaining=[...entries],unmatched=[];
          const same=(a,b)=>Academy.normalizeName(a||'')===Academy.normalizeName(b||'');
          for(const q of [...plan.queue.filter(q=>q.done),...plan.queue.filter(q=>!q.done)]){
            const at=remaining.findIndex(e=>same(e.champion,q.champion)&&Academy.itemMatches(e.item,q.academyItem||q.item));
            if(at>=0)q.recommendedOrder=remaining.splice(at,1)[0].rank;else unmatched.push(q);
          }
          let tail=entries.length;
          for(const q of unmatched){const at=q.champion?remaining.findIndex(e=>same(e.champion,q.champion)):-1;q.recommendedOrder=at>=0?remaining.splice(at,1)[0].rank:tail++;}
        }
      }
      let next=plan.queue.reduce((n,q)=>Number.isFinite(q.recommendedOrder)?Math.max(n,q.recommendedOrder+1):n,0);
      for(const q of plan.queue)if(!Number.isFinite(q.recommendedOrder))q.recommendedOrder=next++;
    },
    pending(plan){return plan.queue.filter(q=>!q.done);},
    recommended(plan){this.ensure(plan);return this.pending(plan).slice().sort((a,b)=>a.recommendedOrder-b.recommendedOrder);},
    apply(plan,ids){
      const pending=this.pending(plan),byUid=new Map(pending.map(q=>[q.uid,q]));
      if(ids.length!==pending.length||new Set(ids).size!==pending.length||ids.some(id=>!byUid.has(id)))return false;
      if(pending.every((q,n)=>q.uid===ids[n]))return false;
      let n=0;plan.queue=plan.queue.map(q=>q.done?q:byUid.get(ids[n++]));return true;
    },
    reset(plan){return this.apply(plan,this.recommended(plan).map(q=>q.uid));},
    inherit(plan,previous,replacements){
      this.ensure(plan);
      const slots=previous.map(q=>q.recommendedOrder).sort((a,b)=>a-b);
      const tail=plan.queue.reduce((n,q)=>Math.max(n,q.recommendedOrder+1),0);
      replacements.forEach((q,n)=>q.recommendedOrder=slots[n]??tail+n);
    }
  };
};

},
"./quick-import": (module, require) => {
'use strict';

module.exports = function createQuickImport(model) {
  const {Academy, academyTier} = model;
  return {
    choose(text, currentPlan) {
      if(!Academy.isCurrent())throw new Error('Refresh live data before importing a team code.');
      const rank=guide=>academyTier(guide.tier==='X'&&currentPlan&&model.CompFinder.requirements(currentPlan,guide).unlocked?'A':guide.tier).rank;
      const result=Academy.match(text);
      if(!result.exact)throw new Error('No exact TFT Academy comp matches this code. Your current queue is unchanged.');
      const candidates=[...result.matches].sort((a,b)=>rank(a.guide)-rank(b.guide)||String(b.guide.updated).localeCompare(String(a.guide.updated))||a.guide.title.localeCompare(b.guide.title));
      const guide=candidates[0].guide,plan=Academy.build(guide);
      if(plan.missing.length)throw new Error('Some items in this guide are not recognized yet. Your current queue is unchanged.');
      if(!plan.entries.length)throw new Error('This guide has no recommended items. Your current queue is unchanged.');
      return {guide,entries:plan.entries,priorities:plan.priorities,variants:candidates.length};
    },
    replace(plan,choice,code) {
      const completed=plan.queue.filter(q=>q.done),available=[...completed];
      const holders=Academy.equipment({...plan,activeComp:{id:choice.guide.id}});
      const pending=[];let covered=0;
      for(const entry of choice.entries){
        const at=available.findIndex(q=>Academy.itemMatches(entry.item,q.item)&&holders.get(q.uid)===entry.champion);
        if(at>=0){available.splice(at,1);covered++;}
        else pending.push({...entry,academyItem:entry.item,planSource:'academy',uid:crypto.randomUUID(),recommendedOrder:pending.length,done:false,used:{}});
      }
      // Preserve physical inventory exactly, including completed items no longer
      // recommended by the new comp. Each owned copy covers only one target.
      plan.queue=[...completed,...pending];plan.pivotIntents={};
      plan.activeComp={guide:Academy.cleanGuide(choice.guide),id:choice.guide.id,title:choice.guide.title,code,patch:Academy.snapshot.patch,itemPriority:choice.priorities||Academy.priorities(choice.guide)};
      return {pending:pending.length,covered};
    }
  };
};

},
"./snapshots": (module, require) => {
'use strict';

const ACADEMY_TTL_MS = 24 * 60 * 60 * 1000;
const files = [
  ['academy', 'data/academy-18.3b.json'],
  ['meta', 'data/metatft-18.3b.json'],
  ['core', 'data/core-items.json'],
  ['secondaryTiers', 'data/academy-secondary-tiers-18.7.json']
];
const academySource = 'TFT Academy';

function validAcademy(snapshot) {
  return snapshot && typeof snapshot.patch === 'string' && snapshot.patch.trim() &&
    Number.isInteger(snapshot.set) && snapshot.set > 0 &&
    Array.isArray(snapshot.guides) && snapshot.guides.length > 0 && snapshot.guides.length <= 500 &&
    Array.isArray(snapshot.champions) && snapshot.champions.length > 0 &&
    Array.isArray(snapshot.items) && snapshot.items.length > 0 && snapshot.items.length <= 1000;
}

function readAcademyCache(raw, expectedSet, now = Date.now()) {
  const snapshot = JSON.parse(raw || 'null');
  const fetchedAt = Date.parse(snapshot?.fetchedAt);
  const age = now - fetchedAt;
  return validAcademy(snapshot) && snapshot.set === expectedSet && age >= 0 && age < ACADEMY_TTL_MS
    ? snapshot : null;
}

function decodeMetaSnapshot(snapshot) {
  if (!snapshot.itemIds) return snapshot;
  const {itemIds, buildColumns, ...metadata} = snapshot;
  return {
    ...metadata,
    units: snapshot.units.map(unit => ({
      ...unit,
      builds: unit.builds.map(([indices,games,avg,score,tier]) => ({
        items: indices.map(index => itemIds[index]), games, avg, score, tier
      }))
    }))
  };
}

async function loadSnapshots(fallback, pageURL, fetchJSON) {
  if (new URL(pageURL).protocol === 'file:') return fallback;
  const signal = AbortSignal.timeout(5000);
  const loaded = await Promise.all(files.map(async ([key, path]) => {
    try {
      const response = await fetchJSON(new URL(path, pageURL), {signal, credentials: 'omit'});
      if (!response.ok) return fallback[key];
      const snapshot = await response.json();
      const valid = key === 'academy' ? validAcademy(snapshot) :
        key === 'meta' ? Array.isArray(snapshot.units) :
        key === 'secondaryTiers' ? snapshot.tiers && Object.values(snapshot.tiers).every(tier => /^[ABC]$/.test(tier)) :
        Array.isArray(snapshot.items) && Array.isArray(snapshot.components);
      if (valid && snapshot.schemaVersion === fallback[key].schemaVersion &&
          snapshot.set === fallback[key].set && snapshot.patch === fallback[key].patch) {
        return key === 'meta' ? decodeMetaSnapshot(snapshot) : snapshot;
      }
    } catch {
      // The build contains the last known good snapshot for standalone use.
    }
    return fallback[key];
  }));
  return Object.fromEntries(files.map(([key], index) => [key, loaded[index]]));
}


const liveTimeout = 15000;
const dayMs = 24 * 60 * 60 * 1000;
const assetKinds = ['champions', 'items', 'augments'];
const academyHost = 'https://tftacademy.com';
const metaHost = 'https://api-hc.metatft.com/tft-stat-api/unit_detail_';

async function getJSON(fetchJSON, url, signal, mode = 'cors') {
  const response = await fetchJSON(url, {signal, credentials: 'omit', cache: 'no-store', mode});
  if (response.type === 'opaque') return null;
  if (!response.ok) throw new Error(new URL(url).host + ' returned HTTP ' + response.status);
  return response.json();
}

function patchId(patch, revision = '') {
  const value = String(patch || '') + String(revision || '');
  return /^\d+\.\d+[a-z]?$/i.test(value) ? value.toLowerCase() : '';
}

function gamePatch(row) {
  return Array.isArray(row.patch) ? patchId(...row.patch) : patchId(row.patch);
}

function metaPatch(overall, items) {
  const days = (overall.games || []).filter(row => row.count > 0 && Number.isInteger(row.day) && row.day > 0);
  const newest = Math.min(...days.map(row => row.day));
  const latest = new Set(days.filter(row => row.day === newest).map(gamePatch));
  const builds = new Set((items.build_games || []).map(row => patchId(row.patch, row.b_patch_version)));
  const [patch] = latest;
  if (!patch || latest.size !== 1 || builds.size !== 1 || !builds.has(patch)) {
    throw new Error('MetaTFT returned inconsistent current patch data');
  }
  return patch;
}

async function fetchMetaTFT(unit, {fetchJSON, signal = AbortSignal.timeout(liveTimeout)}) {
  const params = '?unit=' + encodeURIComponent(unit) +
    '&queue=1100&patch=current&days=3&rank=CHALLENGER,DIAMOND,EMERALD,GRANDMASTER,MASTER,PLATINUM&permit_filter_adjustment=true';
  const [overall, items] = await Promise.all([
    getJSON(fetchJSON, metaHost + 'overall' + params, signal),
    getJSON(fetchJSON, metaHost + 'items' + params + '&num_items=3', signal)
  ]);
  if (overall?.unit !== unit || items?.unit !== unit || overall.tft_set !== items.tft_set) {
    throw new Error('MetaTFT returned a different champion or set');
  }
  return {overall, items, patch: metaPatch(overall, items)};
}

// Academy's current guide API omits the patch ID. Require an Academy update
// inside a full day of MetaTFT's current-only patch window in that case.
function guideUpdateMatchesPatch(sourceUpdated, overall, patch) {
  const updated = Date.parse(sourceUpdated);
  const today = Math.floor(Number(overall.updated) / dayMs) * dayMs;
  const days = (overall.games || []).filter(row => row.count > 0 && Number.isInteger(row.day) && row.day > 0);
  const latestOther = Math.min(...days.filter(row => gamePatch(row) !== patch).map(row => row.day));
  const oldestCurrent = Math.max(...days.filter(row => gamePatch(row) === patch).map(row => row.day));
  const firstFullDay = Math.min(latestOther - 1, oldestCurrent);
  return firstFullDay >= 1 && updated >= today - (firstFullDay - 1) * dayMs &&
    updated <= Number(overall.updated);
}

function verificationUnit(guides, champions) {
  const playable = new Set(champions.filter(unit => unit.cost > 0).map(unit => unit.apiName));
  return guides.find(guide => playable.has(guide.mainChampion?.apiName))?.mainChampion.apiName ||
    playable.values().next().value;
}

async function refreshAcademy(academy, {fetchJSON, set, compactMeta, signal = AbortSignal.timeout(liveTimeout)}) {
  try {
    const get = (path, mode) => getJSON(fetchJSON, academyHost + path, signal, mode);
    const readAssets = gameSet => Promise.all(assetKinds.map(kind => get(`/api/assets/${kind}?set=${gameSet}`)));
    const previous = academy.snapshot;
    const previousUnit = verificationUnit(previous.guides, previous.champions);
    const initialAssets = readAssets(previous.set).catch(error => error);
    const initialMeta = fetchMetaTFT(previousUnit, {fetchJSON, signal}).catch(error => error);
    // The legacy route no longer allows CORS. A browser can still request it
    // without a CORS error, and same-origin clients can read its patch field.
    const legacy = await get('/tierlist/comps/__data.json', 'no-cors');
    const nodes = legacy ? academy.unpack(legacy) : [];
    let guideData = nodes.find(node => Array.isArray(node?.guides));
    if (!guideData) guideData = await get('/api/tierlist/comps');
    const guides = guideData?.guides?.filter(guide => guide.isPublic && Array.isArray(guide.finalComp)) || [];
    const guideSet = Math.max(...guides.map(guide => Number(guide.set) || 0));
    if (!Number.isInteger(guideSet) || guideSet <= 0 || set && guideSet !== set) {
      throw new Error('TFT Academy returned a different or empty set');
    }
    const currentGuides = guides.filter(guide => Number(guide.set) === guideSet);
    const assets = guideSet === previous.set ? await initialAssets : await readAssets(guideSet);
    if (assets instanceof Error) throw assets;
    const [champions, items, augments] = assets;
    for (const [kind, assets] of Object.entries({champions, items, augments})) {
      if (!Array.isArray(assets?.[kind]) || !assets[kind].length ||
          assets[kind].some(asset => asset.set != null && Number(asset.set) !== guideSet)) {
        throw new Error('TFT Academy returned missing or mismatched ' + kind);
      }
    }
    const previousUnitIsCurrent = guideSet === previous.set &&
      champions.champions.some(unit => unit.apiName === previousUnit && unit.cost > 0);
    const unit = previousUnitIsCurrent ? previousUnit : verificationUnit(currentGuides, champions.champions);
    if (!unit) throw new Error('No current champion to verify against MetaTFT');
    const meta = previousUnitIsCurrent ? await initialMeta : await fetchMetaTFT(unit, {fetchJSON, signal});
    if (meta instanceof Error) throw meta;
    if (meta.overall.tft_set !== 'TFTSet' + guideSet) throw new Error('Academy and MetaTFT sets differ');
    const academyPatch = nodes.find(node => node?.patch)?.patch || guideData.patch;
    const guideUpdated = currentGuides.map(guide => String(guide.updated || '').replace(' ', 'T'))
      .filter(date => Number.isFinite(Date.parse(date))).sort((a, b) => Date.parse(a) - Date.parse(b)).at(-1);
    const sourceUpdated = guideData.lastUpdated || nodes.find(node => node?.lastUpdated)?.lastUpdated || guideUpdated;
    if (academyPatch ? patchId(academyPatch) !== meta.patch :
        !guideUpdateMatchesPatch(String(sourceUpdated).replace(' ', 'T'), meta.overall, meta.patch)) {
      throw new Error('Academy and MetaTFT patches could not be matched');
    }
    const snapshot = academy.normalize([{guides: currentGuides, patch: meta.patch, lastUpdated: sourceUpdated}],
      champions, items, augments);
    const stats = compactMeta(meta.overall, meta.items, meta.patch);
    signal.throwIfAborted();
    return {updated: true, snapshot, stats};
  } catch (error) {
    return {updated: false, notice: error.name === 'TimeoutError' ? 'Live data refresh timed out' : error.message};
  }
}

async function refreshLiveData({Academy, MetaBuilds}, options) {
  const revision = ++Academy.revision;
  Academy.live = false;
  const result = await refreshAcademy(Academy, {...options, compactMeta: MetaBuilds.compact});
  if (revision !== Academy.revision) return {updated: false, superseded: true};
  if (result.updated) {
    Academy.useSnapshot(result.snapshot);
    MetaBuilds.cache({...result.stats, fetchedAt: Date.now()}, 'live');
    Academy.liveMetaUnit = result.stats.unit;
    Academy.live = true;
  }
  return result;
}

    const refresh=()=>{const o=[...select.querySelectorAll('option')].find(o=>o.value===select.value)||select.querySelector('option');trigger.innerHTML=picture(o?.value||'')+'<span>'+esc(o?.textContent||'Choose')+'</span><span class="picker-chevron">⌄</span>';if(!pop.hidden)draw();};

/* Native dialog backdrops belong to the dialog element. Only a press AND
   release outside its rectangle dismisses it; clicks in padding stay open. */
const DialogDismiss = {
  outside(dialog,event){const r=dialog.getBoundingClientRect();return Number.isFinite(event.clientX)&&Number.isFinite(event.clientY)&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom);}
};
(() => {
  let pressed=null;
  document.addEventListener('pointerdown',e=>{const d=e.target.closest?.('dialog[open]');pressed=d&&DialogDismiss.outside(d,e)?d:null;},true);
  document.addEventListener('pointercancel',()=>{pressed=null;},true);
  document.addEventListener('click',e=>{const d=e.target.closest?.('dialog[open]');if(d&&pressed===d&&DialogDismiss.outside(d,e))d.close();pressed=null;},true);
})();
