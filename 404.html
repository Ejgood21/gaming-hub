<!doctype html>
<html lang="en">
  <head>
    {{head}}
    <title>Page not found — Personal Gaming Hub</title>
  </head>
  <body>
    {{header}}
    <main id="main" tabindex="-1" class="page app-page">
      <section class="placeholder-intro">
        <p class="eyebrow">404 / OFF THE MAP</p>
        <h1>A wrong turn.<br /><span>No lost progress.</span></h1>
        <p class="app-description">
          This page isn’t in the hub. Let’s get you back to familiar ground.
        </p>
        <a class="button-link" href="/"
          >Back to the hub
          <span aria-hidden="true"
            ><svg
              class="direction-icon"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4 12 12 4M4 4h8v8"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              /></svg></span
        ></a>
      </section>
    </main>
    {{footer}}
  </body>
</html>
