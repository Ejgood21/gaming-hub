# Temporary validation for this design PR. Removed once its captured assets and
# measurements are committed; the regular read-only PR checks remain in place.
name: Capture hub design validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  capture:
    if: github.head_ref == 'codex/hub-design-refresh' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hub-design-refresh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Cache and verify original icon art
        run: node scripts/cache-wow-icons.mjs
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /gaming-hub/
      - name: Install browser check runner
        run: |
          npm install --prefix /tmp/hub-browser --ignore-scripts --no-package-lock playwright@1.56.1
          node /tmp/hub-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build baseline from the requested main commit
        run: |
          mkdir /tmp/hub-baseline
          git fetch origin 92e160a455d834ba0ea54b6753896c957a7a5ec2
          git archive 92e160a455d834ba0ea54b6753896c957a7a5ec2 | tar -x -C /tmp/hub-baseline
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/hub-baseline/node_modules
          cd /tmp/hub-baseline
          BASE_PATH=/gaming-hub/ npm run build
      - name: Check desktop and touch UI and measure density
        run: |
          node --input-type=module -e 'const {createStaticServer}=await import("./scripts/serve.mjs"); createStaticServer({basePath:"/gaming-hub/"}).listen(4173,"127.0.0.1");' &
          node --input-type=module -e 'const {createStaticServer}=await import("/tmp/hub-baseline/scripts/serve.mjs"); createStaticServer({basePath:"/gaming-hub/"}).listen(4174,"127.0.0.1");' &
          export PLAYWRIGHT_MODULE=/tmp/hub-browser/node_modules/playwright/index.mjs
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "/tmp/hub-browser/node_modules/playwright/index.mjs"; console.log(chromium.executablePath())')"
          BASELINE_URL=http://127.0.0.1:4174/gaming-hub/ UI_OUTPUT=docs/design-refresh npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-design-validation
          path: |
            docs/design-refresh/
            apps/wow/assets/icons/
            apps/wow/config/icons.json
      - name: Record verified art and screenshots on the requested PR branch
        if: always()
        run: |
          mkdir -p docs/design-refresh
          git add apps/wow/assets/icons apps/wow/config/icons.json docs/design-refresh
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Cache Blizzard icon art and capture desktop and mobile validation'
          git push origin HEAD:codex/hub-design-refresh
