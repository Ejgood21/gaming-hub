<!doctype html>
<html lang="en">
<head>{{head}}<title>Personal Gaming Hub</title><meta name="description" content="Game releases and tools for your next session."><script src="/assets/filters.js" defer></script></head>
<body>{{header}}
<main id="main" tabindex="-1" class="page">
  <section class="hero" aria-labelledby="hero-title">
    <div><p class="eyebrow">YOUR GAMING DESK</p><h1 id="hero-title">Ready for your <span>next session.</span></h1><p class="hero-description">Releases to watch. Tools to play.</p></div>
    <a class="text-link hero-link" href="/wow/">Find your WoW spec <span aria-hidden="true">↗</span></a>
  </section>
  <section class="releases" aria-labelledby="releases-title">
    <div class="section-heading"><h2 id="releases-title">Release tracker</h2><p class="section-aside">Hand-kept · dates may change</p></div>
    <div class="release-toolbar"><div class="filters" role="group" aria-label="Filter releases by status" hidden>
      <button type="button" data-filter="all" aria-pressed="true">All games <span>4</span></button>
      <button type="button" data-filter="firm" aria-pressed="false">Firm</button>
      <button type="button" data-filter="tba" aria-pressed="false">TBA</button>
      <button type="button" data-filter="unconfirmed" aria-pressed="false">Unconfirmed</button>
    </div><p class="sr-only" data-filter-result role="status" aria-live="polite"></p></div>
    <div class="release-grid">{{releaseCards}}</div>
  </section>
  <section id="tools" class="tools" aria-labelledby="tools-title"><div class="section-heading"><h2 id="tools-title">Your tools</h2></div><div class="tool-grid">{{appCards}}</div></section>
  <a class="back-to-top" href="#main">↑ Top</a>
</main>{{footer}}</body></html>
